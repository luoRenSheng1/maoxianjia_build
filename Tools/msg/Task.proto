//兑换npc积分道具
message ExchangeItemByNPCPoints_CS   //eMsg_ExchangeItemByNPCPoints_CS = 684; 
{
	optional  uint32 store_id = 2; //event store表中的主id
	optional  uint32 amount = 1; //兑换道具数量
} 

