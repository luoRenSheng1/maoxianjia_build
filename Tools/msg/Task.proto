	optional  uint64 event_guid = 7; //event guid    ---- 如果过期了找不到，客户端就不处理
	optional BatchStuff batch_stuff = 8; //随机事件内部道具或事件数据   //刷新下事件内的任务状态  ---- 如果过期了找不到，客户端就不处理
} 

//放弃进行中的委托任务
message DropNPCTask_CS  //eMsg_DropNPCTask_CS = 680; 
{
    optional  uint32 task_id = 1;				//配置表中任务id
} 

//放弃进行中的委托任务反馈
message DropNPCTask_SC   //eMsg_DropNPCTask_SC = 681; 
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
    optional  uint32 task_id = 2;				//配置表中任务id
	optional  uint64 event_guid = 3; //event guid ---- 如果过期了找不到，客户端就不处理
	optional BatchStuff batch_stuff = 4; //随机事件内部道具或事件数据   //刷新下事件内的任务状态  ---- 如果过期了找不到，客户端就不处理
} 


//上供完成任务
message OfferItem4Task_CS   //eMsg_OfferItem4Task_CS = 686;  
{
    optional  uint32 task_id = 1;				//配置表中任务id
	optional  eTaskType task_type = 2;  //任务类型
}


 //上供完成任务反馈
message OfferItem4Task_SC   //eMsg_OfferItem4Task_SC = 687;  
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
    optional  uint32 task_id = 2;				//配置表中任务id
	optional  eTaskType task_type = 3;  //任务类型
	optional Finance finance = 4;  //最新账户余额
	repeated ItemInfo cost_items = 5;  //上供消耗的道具
}

	
	
	
//刷新npc任务
message ShuffleNpcTasks_CS   //eMsg_ShuffleNpcTasks_CS = 682; 
{
	optional  uint64 event_guid = 2; //event guid
} 

//刷新npc反馈
