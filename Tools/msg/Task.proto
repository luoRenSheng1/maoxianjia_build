syntax = "proto2";
import "ErrCode.proto";
import "Enum.proto";
import "Common.proto";
package msg;


	         
	       
	



// 服务器端主动下发主线任务完成通知
message MainTaskFinish_PC   //eMsg_MainTaskFinish_PC 			= 652;	
{
	optional uint32 finished_task_id = 1;  //完成的任务id
	optional int64  finished_task_process = 2 ;  //完成的任务id对应的进度
	//optional uint64 finished_timestamp = 3;  //完成时间戳
}



//主线任务进度刷新
message PlayerMainTaskInfoUpdate_PC {			//[default = eMsg_PlayerMainTaskInfoUpdate_PC    =653]
	optional uint32  main_task_id = 1 ;  //当前承接的主线任务id， 为0表示没有或都做完了
	optional int64  main_task_process = 2 ;  //当前承接的主线任务id对应的进度
}



//任务完成领取奖励
message ClaimTaskAward_CS  { //eMsg_ClaimTaskAward_CS = 654;      
	//optional bool is_watched_ad = 1; //是否看广告   false--没看广告， true--看广告
}



//任务完成领取奖励反馈
message ClaimTaskAward_SC { //eMsg_ClaimTaskAward_SC = 655;     
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional uint32 finished_task_id = 2;  //完成的任务id
	repeated ItemInfo   awards = 5;  //任务奖励
	optional Finance finance = 6;  //最新账户余额

	optional uint32  next_task_id = 7 ;  //当前承接的主线任务id， 为0表示没有或都做完了
	optional int64  main_task_process = 8 ;  //当前承接的主线任务id对应的进度
}
  
	

message TaskInfo 
{			
	optional uint32  task_id = 1 ;  //任务ID
	optional int64  task_process = 2 ;  //任务进度，当进度已等于或超过表中配置值后，不会再下发
	optional bool is_claim_award = 3;  //是否已领取奖励
}

	

//每日任务信息请求
message DailyTaskInfo_CS  { //eMsg_DailyTaskInfo_CS = 656;     

}


//每日任务信息请求反馈
message DailyTaskInfo_SC { //eMsg_DailyTaskInfo_SC = 657; 
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	repeated TaskInfo daily_tasks = 2; //每日任务信息
	optional int64  active_value = 3;  //每日任务活跃值
	repeated uint32 claimed_active_award_id = 4; //已领取活跃值奖励的id--ActiveGift表的主键
}

  
//每日任务进度更新
message DailyTaskProcess_PC { //eMsg_DailyTaskProcess_PC = 662;  
	optional TaskInfo daily_task = 1; //当前变更进度任务信息
	optional int64  active_value = 2;  //每日任务活跃值--在任务完成时会有变动
}



	 
	



//领取每日任务奖励请求
message ClaimDailyTaskAward_CS  { //eMsg_ClaimDailyTaskAward_CS = 658;   
	optional uint32  task_id = 1 ;  //任务ID
}



//领取每日任务奖励反馈
message ClaimDailyTaskAward_SC { //eMsg_ClaimDailyTaskAward_SC = 659;    
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional uint32 task_id = 2;  //完成的任务id
	optional ItemInfoWithRandBox   awards = 3;  //任务奖励
	optional Finance finance = 4;  //最新账户余额
	optional int64  active_value = 5;  //每日任务活跃值
}
                
	
	
	 
	

