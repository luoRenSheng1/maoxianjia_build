// 获取当前红点列表
message GetRedPoints_CS { //eMsg_GetRedPoints_CS		= 310;		
}

message RedPoint {
	optional eRedPointType type = 1;//红点类型
	optional int32 param = 2;		//红点参数，具体业务约定,详见枚举
}

// 获取当前红点列表反馈
message GetRedPoints_SC { //eMsg_GetRedPoints_SC		= 311;		
	repeated RedPoint red_points = 1;
}

// 主动推送红点下发 --- 登录或游戏中不是一定会有的，只有服务器端发现有设计需要通知的红点才会主动下发这个包
message SyncRedPoints_PC { //eMsg_SyncRedPoints_PC		= 312;		
	repeated RedPoint red_points = 1;
}



// 已读红点提交
message ReadRedPoints_CS { //eMsg_ReadRedPoints_CS       = 313;	
	optional RedPoint red_points = 1;
}

 // 已读红点提交反馈
message ReadRedPoints_SC { //eMsg_ReadRedPoints_SC       = 314; 
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional RedPoint red_points = 2;
}
      
	    


