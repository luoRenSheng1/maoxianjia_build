syntax = "proto2";
import "ErrCode.proto";
import "Enum.proto";
import "Common.proto";
package msg;

// 客户端ping
message ClientPing_CS 
{			//[default = eMsg_ClientPing_CS];		
}

// 客户端ping服务器回复
message ClientPing_SC 
{			//[default = eMsg_ClientPing_SC];
	optional uint64 time_stamp = 1;		//服务器时间戳
}

// 客户端发送PM命令
message Pm_CS 
{					//[default = eMsg_Pm_CS]
	optional string str_param = 1;		//PM命令
}

// 服务器端返回PM命令校验结果
message Pm_SC
{					//[default = eMsg_Pm_SC]
	optional string str_param = 1;		//PM命令
	optional eErrCode	result = 2;// [default = eSucceed];	
	optional uint64 server_time_stamp = 3;		//服务器时间戳
	optional uint64 server_daily_reset_time_stamp = 4;		//下一次每日重置服务器时间戳(目前都是服务器的0点)
}


//    登录后下发天赋
message PlayerTalents4Login_PC {			//[eMsg_PlayerTalents4Login_PC = 289;        ]
	repeated TalentInfo talents = 1;
	optional SplitPkgPC split_info = 2;
}

//eMsg_LoginFinish_SC 消息后，主动下发玩家基本信息
message PlayerBasicInfo4Login_PC {			//[default = eMsg_PlayerBasicInfo4Login_PC]
	optional uint64 user_id = 1;				//玩家id
	optional string name = 2;				//玩家名字	
	repeated PlayerAttr player_attr = 3;    //数值型属性组
	repeated PlayerEquipSlotsInfo equip_slots = 4;  //装备栏
	repeated PlayerRuneSlotsInfo rune_slots = 5;  //符石栏
	repeated PlayerPetSlotsInfo pet_slots = 6;  //宠物栏
	repeated PlayerSkillSlotsInfo skill_slots = 7;  //技能栏
	optional uint64 server_time_stamp = 8;		//服务器时间戳
	optional uint64 server_daily_reset_time_stamp = 9;		//下一次每日重置服务器时间戳(目前都是服务器的0点)
	optional uint64 server_weekly_reset_time_stamp = 10;		//下一次每周重置服务器时间戳(目前都是服务器的周一0点，一周的开始)
	repeated PlayerEquipSlotsInfo lore_equip_slots = 11;  //传承装备栏
	repeated PlayerHolySlotsInfo holy_slots = 12;  //圣物栏
}


//eMsg_LoginFinish_SC 消息后，//登录的章节地图和随机任务信息
message PlayerChapterMapInfo4Login_PC {			//[default = eMsg_PlayerChapterMapInfo4Login_PC = 287; ]
	optional ChapterMapInfo chapter_stage = 1;				//章节关卡信息
	repeated  RandomEvent events = 2;				//随机事件
	repeated FinishEvent  finshed_event_info = 3;  //完成随机事件信息
}

//eMsg_LoginFinish_SC 消息后，下发委托任务信息
message PlayerNPCTask4Login_PC {			//[default = eMsg_PlayerNPCTask4Login_PC = 288; ]
	repeated  NpcTask npc_tasks = 1;				//npc委托任务	
	repeated NpcTaskExchangeItemsInfo  exchange_info = 2; //兑换信息
}


// 客户端主动获取玩家信息
message PlayerInfo_CS {			//[default = eMsg_PlayerInfo_CS]
}

// 获取玩家信息反馈&&推送玩家信息
message PlayerInfo_SC {			//[default = eMsg_PlayerInfo_SC]
	optional uint64 user_id = 1;				//玩家id
	optional string name = 2;				//玩家名字	
	repeated PlayerAttr player_attr = 3;    //数值型属性组
	repeated PlayerEquipSlotsInfo equip_slots = 4;  //装备栏
	repeated PlayerRuneSlotsInfo rune_slots = 5;  //符石栏
	repeated PlayerPetSlotsInfo pet_slots = 6;  //宠物栏
	repeated PlayerSkillSlotsInfo skill_slots = 7;  //技能栏
}




    
	     

