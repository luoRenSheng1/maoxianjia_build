// 获取屏蔽词库列表
message GetForbiddenWord_CS {		// eMsg_GetForbiddenWord_CS
	optional uint32 clientversion = 1;		// 客户端屏蔽词库版本号
	optional uint64 lastid = 2;				// 上个包最后的id，0-重头开始取
}

// 屏蔽词库条目
message ForbiddenWord {
	optional uint64 guid = 1;				// id
	optional string forbiddenword = 2;		// 屏蔽词内容
	optional uint32 type = 3;				// 屏蔽类型：0=模糊，1=精确
}

// 获取屏蔽词库列表反馈
message GetForbiddenWord_SC {		// eMsg_GetForbiddenWord_SC
	optional uint32 serverversion = 1;		// 服务端屏蔽词库版本号，如果跟客户端版本号一样，则不下发列表
	repeated ForbiddenWord words = 2;		// 屏蔽词库列表
	optional uint32 endflag = 3;			// 结束标志：1-最后一个包
	optional eErrCode err_code = 4;			// 错误码
}


	     
	     
	     
	    
	     
	   

