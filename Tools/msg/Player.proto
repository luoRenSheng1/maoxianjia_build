	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional uint64 server_time_stamp = 2;		//服务器时间戳
	optional uint64 server_daily_reset_time_stamp = 3;		//下一次每日重置服务器时间戳(目前都是服务器的0点)
	optional uint64 server_weekly_reset_time_stamp = 4;		//下一次每周重置服务器时间戳(目前都是服务器的周一0点，一周的开始)
