}	


//宠物放入战斗栏
message PetInSlot_CS   //eMsg_PetInSlot_CS = 1102 ;  
{
	optional uint64  pet_id = 1; //
	optional uint32  pet_slot_id  = 2;  //栏id
}		   					
			
