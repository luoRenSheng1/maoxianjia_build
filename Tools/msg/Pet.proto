{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional uint64  pet_id = 2; //
	optional PlayerPetSlotsInfo pet_slot = 3;  //宠物栏状信息
}		             
	          
 
	 
	         
//宠物在装备栏里交换位置
message PetsSwitchInSlots_CS   //eMsg_PetsSwitchInSlots_CS = 1106; 
{
	optional uint32  slot_id1  = 1;  //要交换的栏1
	optional uint32  slot_id2  = 2;  //要交换的栏2
}      

//宠物再装备栏里交换位置回复      
message PetsSwitchInSlots_SC   //eMsg_PetsSwitchInSlots_SC = 1107; 
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	repeated PlayerPetSlotsInfo pet_slot = 2;  //宠物栏状信息
}		 









//宠物升级
message PetLevelUp_CS   //eMsg_PetLevelUp_CS 
{
	optional uint64  pet_id = 1; //
	optional uint32  levelup_times = 2; //要升多少级，填0 直接升到同名卡用光
}		   					
			
//宠物升级回复
message PetLevelUp_SC   //eMsg_PetLevelUp_SC 
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional uint64  pet_id = 2; //
	optional int32  pet_level = 3; //最新宠物等级
	optional Finance account_finance = 4;  //账户所有各种货币其余额
	repeated ItemInfo items = 5;           //消耗道具 -- 显示外加本地数量扣除

}	


	
	 

