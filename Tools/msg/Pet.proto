//下发新获取的宠物 支持多件
message NewPets_PC
{			//[default = eMsg_NewPets_PC = 1101 ;];
	repeated PetInfo  pets = 1;
	optional SplitPkgPC split_pkg = 2;
}


        
	          
//宠物批量放入战斗栏
message BatchReplacePetInSlot_CS   //eMsg_BatchReplacePetInSlot_CS = 1135 ;   
{
	repeated uint64  pet_id = 1; //
}		   					
			
//宠物批量放入战斗栏回复
message BatchReplacePetInSlot_SC   //eMsg_BatchReplacePetInSlot_SC = 1136 ;
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
