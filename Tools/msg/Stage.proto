syntax = "proto2";
import "ErrCode.proto";
import "Enum.proto";
import "Common.proto";
package msg;



      
	                  
	

//进入新章节地图
message EnterChapterMap_CS   //eMsg_EnterChapterMap_CS = 428; 
{
	optional uint64  start_chapter_id = 1; // 要开始的章节
}	

//进入新章节地图回包  
message EnterChapterMap_SC   //eMsg_EnterChapterMap_SC = 429;   
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	//optional uint64 start_stage_id = 2;  // 要开始的关卡  --- 为0--表示本章节无可挂机关卡，非0 表示可挂机的本章最高关卡，同步玩家属性里的 latest_passed_stage
	//optional uint64  start_chapter_id = 3; // 要开始的章节

	//optional  eChapterMapStatus player_map_status = 4;  //是否在大地图上
	//optional  eBattleStatus is_idle = 5;  //是挂机，还是过关
	
	optional ChapterMapInfo chapter_stage = 6;				//章节关卡信息
	repeated  RandomEvent events = 7;				//随机任务	
}


//关卡选择  客户端提交
message ChooseStage_CS   //eMsg_ChooseStage_CS = 426; 
{
	optional uint64 start_stage_id = 1;  // 要开始的关卡
	optional uint64  start_chapter_id = 2; // 要开始的章节
	
}

//关卡选择  服务器反馈
message ChooseStage_SC   //eMsg_ChooseStage_SC = 427;       
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional uint64 start_stage_id = 2;  // 要开始的关卡
	optional uint64  start_chapter_id = 3; // 要开始的章节
}
	
	
//关卡开始  客户端提交
message Stage_Begin_CS   //eMsg_Stage_Begin_CS = 400; 
{
	optional uint64 start_stage_id = 1;  // 要开始的关卡
	optional uint64  start_chapter_id = 2; // 要开始的章节
	optional  eBattleStatus is_idle = 3;  //是挂机，还是过关
}

message MonsterAward
{
	optional int32 monster_id  = 1; //monster group表里的 MonsterId
	optional int32 monster_id_index  = 2; //monster group表里的 MonsterId对应的num如果多个的话，则未index下表 从0开始表示第一只
	optional double award_gold = 3; //击杀该怪物获得的金钱 --- 没有就是 0
}

message MonsterGroup
{
	optional int32 group_id = 1;  //stage.xlsx表格里出现的 怪物 group的 id 
	repeated MonsterAward monster_awards = 2;  //每一波怪物里的每个怪物的出产金币信息
	optional uint32 node_id = 3;  //第几波怪的id -- stage表里的 Node 字段
}

	     
//关卡开始服务器端下发相关数值
message Stage_Begin_SC   //eMsg_Stage_Begin_SC = 401; 
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional uint64 start_stage_id = 2;  // 要开始的关卡
	repeated MonsterGroup  monster_group_awards = 3;  //要出产的金币
	
	//optional  eChapterMapStatus player_map_status = 4;  //是否在大地图上
	optional  eBattleStatus is_idle = 5;  //是挂机，还是过关
}



//挑战中到达第几个节点上报请求(过完后)
message ReachNodeInStageChallenge_CS   //eMsg_ReachNodeInStageChallenge_CS = 430;   
{
	optional uint32 node_id = 1;  // 到达的节点 ，初始没有0，开始到第一个节点开始打怪发1，依次类推
}

//挑战中到达第几个节点上报回馈--客户端应该无需处理，如果是作弊提交数据包会提示失败
message ReachNodeInStageChallenge_SC   //eMsg_ReachNodeInStageChallenge_SC = 431;  
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional uint32 node_id = 2;  // 到达的节点 ，初始没有0，开始到第一个节点开始打怪发1，依次类推
	
}


	 



//每波怪物奖励提交
message Stage_AwardCommit_CS   //eMsg_Stage_AwardCommit_CS = 402;
{
	//optional int32 group_id = 1;  //怪物groupID，不用穿
	optional uint32 node_id = 1;  //第几波怪的id -- stage表里的 Node 字段
	optional int32 monster_id = 2;  //怪物id
	optional int32 monster_idx = 3;  //如果怪物id一样的话， 发送index索引上来
	optional float pos_x = 5; //透传客户端坐标
	optional float pos_y = 6; //透传客户端坐标
	
	optional bool killed_by_pet = 7;  //是否被宠物杀死， false--英雄杀死， true---宠物杀死
	optional bool killed_by_atk = 8;  //是否被普攻杀死， false--被技能杀死, true---普通攻击杀死
	optional uint32 killed_by_skill_id  =9;  //如果是被技能杀害，则传技能ID（宠物杀害的话传宠物技能ID， 英雄的传英雄身上的技能ID）。不是技能击杀的，填0即可
	optional uint64 killed_by_pet_guid = 10;  //如果是被宠物普攻或技能杀死的，填宠物guid，否则填0
}

//每波怪物奖励提交服务器端反馈
message Stage_AwardCommit_SC   //eMsg_Stage_AwardCommit_SC = 403;
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional int32 group_id = 2;  //第几波怪物
	optional int32 monster_id = 3;  //怪物id
	optional int32 monster_idx = 4;  //如果怪物id一样的话， 发送index索引上来
	optional double monster_gold = 5; //服务器端下发本次杀怪获得的金币
	optional Finance finance = 6;  //最新账户余额
	optional uint32 node_id = 7;  //第几波怪的id -- stage表里的 Node 字段
	optional float pos_x = 8; //透传客户端坐标
	optional float pos_y = 9; //透传客户端坐标
	optional RuneInfo rune = 10;  //是否随机生成符石
	optional ItemInfoWithRandBox drop_item = 11;  //是否随机额外掉落道具
}

                
//关卡结束 客户端提交
message Stage_End_CS   //eMsg_Stage_End_CS = 404;
{
	optional float pos_x = 1; //透传客户端坐标
	optional float pos_y = 2; //透传客户端坐标
}	                
	
//关卡结束 服务器提交
message Stage_End_SC   //eMsg_Stage_End_SC = 405;
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional bool is_first = 2;  //是否首通
	optional ItemInfoWithRandBox reward_items = 5;  //首通奖励
	optional ItemInfoWithRandBox radnom_reward_items = 6;  //随机奖励
	
	optional uint32  latest_node = 3;  //最后挂机节点
	optional uint64  latest_passed_stage = 7; //当前通过的最后关卡--最后挂机关卡
	optional Finance finance = 8;  //最新账户余额
	optional RuneInfo rune = 10;  //是否随机生成符石
	optional eBattleStatus status = 11;   //战场状态
	optional float pos_x = 12; //透传客户端坐标
	optional float pos_y = 13; //透传客户端坐标
	
	optional ChapterMapInfo chapter_stage = 16;				//章节关卡信息
}		
				
						
		        
     	           
