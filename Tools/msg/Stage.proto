//进入奇遇商人山洞反馈
message EnterCave_SC   //eMsg_EnterCave_SC = 486;    
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional uint64 event_guid = 2;  //事件guid
	repeated ItemInfo player_item_limitation = 3; //目前没每日限制，无用，就是空，无视 --- 玩家当前奇遇商人本日购买材料个数信息，可与配置表比较，得出是否可以购买
}

//找奇遇商人购买
message PurchaseInCave_CS   //eMsg_PurchaseInCave_CS = 487;  
{
	optional uint64 event_guid = 1;  //事件guid 
	optional uint32 stuff_id = 2; //服务器下发的  stuff里的id
	optional uint32 amount = 3; //购买数量----废弃
}
//找奇遇商人购买反馈
message PurchaseInCave_SC   //eMsg_PurchaseInCave_SC = 488;    
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional uint64 event_guid = 2;  //事件guid
	optional uint32 stuff_id = 3; //要购买的道具id -- 服务器下发的 cfg_id
	optional uint32 amount = 4; //剩余限制购买次数
	optional ItemInfo player_item_limitation = 5; //目前没每日限制，无用，就是空，无视 ---该购买道具每日购买次数刷新
	optional ItemInfoWithRandBox reward_items = 6;  //购买成功的道具
	optional Finance finance = 7;  //最新账户余额
	optional BatchStuff remain_items_in_store = 8; //该id剩余可购买数量  
}


