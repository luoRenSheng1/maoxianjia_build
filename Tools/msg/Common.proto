//	optional uint32 box_item_id = 1; //宝箱itemid --itemtype表中的道具id
//	repeated RandBoxResult box_rand_result = 2; //随机结果
//}



//头像
message AvatarInfo 
{
	optional uint32 id = 1;  //itemtype表的item id
	optional uint64 expired_time = 2; //到期时间戳，如果是0表示普通道具，proto不占用数据包空间
}

//头像框
message AvatarFrameInfo 
{
	optional uint32 id = 1;  //itemtype表的item id
	optional uint64 expired_time = 2; //到期时间戳，如果是0表示普通道具，proto不占用数据包空间
}

//道具
message ItemInfo 
{
	optional uint32 id = 1;  //itemtype表的item id
	optional double num = 2; //数量   //如果是随机宝箱，目前数量会是1
	optional uint64 expired_time = 3; //最早一个要到期道具的到期时间戳，如果是0表示普通道具，proto不占用数据包空间
	//optional double gold_num = 4; //金币专用，金币会超出uint64,所以如果 id是msg::eCurrencyItemID_Gold 的话并且 num溢出变成负数，则读取该字段显示数量
	optional uint32 replace_item_id = 5;  //非0表示 转换为替换道具id；
	optional double replace_item_num = 6;  //替换道具的数量
	optional uint64 guid = 7; //道具guid 
}

//待领取奖励列表成员
message ItemListNode
{
    optional uint32 item_index = 1; //下标 --按业务需要从0 或1开始
	optional uint32 item_id = 2;  //itemtype表的item id
	optional double num = 3; //数量，兼容后面关卡大额金币，用double
}


//道具带guid
message ItemInfoWithGuid 
{
	optional uint32 id = 1;  //itemtype表的item id
	optional double num = 2; //数量   //如果是随机宝箱，目前数量会是1
	optional uint64 expired_time = 3; //最早一个要到期道具的到期时间戳，如果是0表示普通道具，proto不占用数据包空间
	optional uint64 item_guid = 4; //道具guid 
	optional uint32 replace_item_id = 5;  //非0表示 转换为替换道具id；
	optional double replace_item_num = 6;  //替换道具的数量
}

//道具附带随机宝箱
message ItemInfoWithRandBox
{
	repeated ItemInfo items = 1; //获得的所有道具
	repeated RandBoxResult box_rand_result = 2; //随机结果--和老虎机一样普通道具客户端需要自行添加本地管理器，如果是角色，技能，符石，宠物会通过pc包下发完整通知
                                           	//随机宝箱的结果，size为0，proto不占用内存空
}

