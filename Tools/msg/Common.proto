//货币
message Finance
{
	optional double golds = 1;  //金币
	optional int64 diamonds = 2;  //钻石
	optional int64 free_diamonds = 3; //免费钻石
}

//奖励
message ItemEx {
	optional uint32 id = 1;
	optional int64 num = 2;
	optional bool is_new = 3[default = false];	//新标志
	optional uint32 multi = 4[default = 1];		//倍数标志(实际拿到物品为num的multi倍)
	optional ItemInfo resolve_items = 5;			//被分解后获得物品(被分解时显示，空说明未被分解)
}



//服务器端主动下发数据的分包结构
message SplitPkgPC
{
    optional bool is_end = 1;    //是否最后一个包
	optional int32 pkg_id = 2;   //第几个分包id，可能用不上
}


//协议分包结构
//客户端根据pkt_guid来确定是否为相同请求反馈列表
message PktFlag {
	optional uint64 pkt_guid = 1;
	optional bool is_last_pkt = 2[default = true];
}



// 消息记录
message ChatInfo
{
    optional uint64 guid = 1;   		// 聊天消息guid，方便运营后台撤销某条消息
    optional uint32 channel = 2;  		// 聊天消息频道(eChatChannel)
    optional uint64 sender_iggid = 3;   // 发送者的iggid
    optional string sender_name = 4;    // 发送者的名字
    optional string content = 5;        // 聊天内容
    optional string json = 6;        	// json格式，可存在物品id、url等等，具体各方协商确定
    optional int64  time_stamp = 7;     // 发送时间
    optional int32 sender_icon = 8;     // 发送者的头像
    optional int32 sender_iconbox = 9;  // 发送者的头像框    
    optional bool can_like = 10;        //是不是点赞类消息
    optional bool liked = 11;		    //消息是否已点赞
	optional uint32 like_cnt = 12;		//消息点赞数
    optional int32 sender_level = 13;   //发送者的等级
    optional uint64 sender_guid = 14;   //发送者的playerguid	
	optional int32 sender_real_vip_lv = 15; 	// vip等级
	
	// 红包聊天消息时，json字段是有包含红包信息，但是操作更新json再转string比较耗时
	// 改为直接下发红包信息
	message LuckyPackage
	{
		optional uint64 guid = 1;				// 红包Guid
		optional int32 base_id = 3;				// 对应lucky_package.xlsx表的ID
		optional int32 received = 8;			// 已经被抢数量
		optional int32 total = 9;				// 总数量
		optional bool enable = 10;				// 是否可抢
	}
	// 客户端先解析下json，判断是红包消息时，该字段的值才有效
	optional LuckyPackage package = 16;	// 红包信息
	
	optional int32 sender_title = 17;  // 发送者的称号
	optional int32 sender_battle_level = 18;  // 发送者战斗等级
}



//角色属性
message RoleAttr {
	optional eRoleAttrType type = 1;
	optional uint64 value = 2;
}


//家园建筑
message BuildInfo 
{
	optional eBuildType build = 1;  //建筑
	optional uint64  start_produce_time = 2;  //开始生产时间，为0表示未解锁，非0表示解锁生产中; 如果当前时间戳 >= start_produce_time + 配置表peak_time 表示停止生产，已满
	optional double	item_num = 3; //当前待领取道具数量
	repeated uint64 pets = 4;   //驻扎宠物信息pet_guid，固定会下发配置的驻扎坑位数数据，如果坑位是0，表示没有驻扎
	optional uint64 next_produce_time = 5;   //下一次道具产出时间  ,如果  当前时间戳 >= next_produce_time 表示停止生产，已满
	//optional double gold_num = 6; //当前待领取金币数量
}






//解锁功能
message FunctionInfo 
{
	optional uint32 func_id = 1;  //system表id
	optional bool is_claim_award = 2; //是否领取了奖励
}


//限制礼包信息
message LimitPackInfo
{
	optional int32 pack_id = 1;  //各个配置表里的 礼包id
	optional int32 purchase_counter = 2; //当前礼包购买次数
	optional uint64 expired_time = 3;  //当前限制购买过期时间---到该时间后，清除，可以重新购买
	optional int32 claim_award_counter = 4;  //礼包奖励领取次数 0--表示没领取， 非0表示领取次数也可以表示已领取了（如果配置没有说明领取次数）
	optional uint64 latest_claimed_time = 5; //最后领取奖励时间--如果判断每日领取的话，没有的话忽视无用
	optional int32 in_counter_counter = 6;  //到账充值数
}


//天下第一玩家排行榜相关数据
message GlobalFirstPlayerRankData
{
	optional uint32 rank = 1;    //排名
	optional uint64 user_id = 2;  //用户id
	optional string user_name = 3;  //姓名
	optional uint32 hero_id = 4;  //英雄id
	optional double battle_power = 5;  //战力
	optional uint64 user_guid = 6;  //服务器端用--客户端可以忽略
	optional uint32 avatar_id = 7;  //头像ID
	optional uint32 avatar_frame_id = 8;  //头像框ID
}

//天下第一玩家战斗相关数据
message GlobalFirstPlayerBattleData
{
	repeated BattleAttr battle_attr = 1;  //统计加好的战斗各项属性
	repeated RuneInfo rune_in_slots = 2;  //符石
	repeated PetInfo pet_in_slots = 3;  //宠物
	repeated SkillInfo skill_in_slots = 4;  //技能
	//optional HeroRoleInfo hero_in_battle = 5;   //英雄 
}

//天下第一玩家每日次数相关数据
message GlobalFirstPlayerDailyData
{
	optional int32 challenge_opportunity = 1;  //每日剩余挑战数
	optional int32 yesterday_rank = 2;    //昨日排名  --小于等于0表示没上榜，大于0表示上榜
	optional int32 today_rank = 3;    //当前排名  --小于等于0表示没上榜，大于0表示上榜
	optional bool has_claim_award = 4; //是否领取昨日奖励
	optional uint32 yesterday_play_counter = 5; //昨日参赛次数
	optional uint32 today_play_counter = 6; //今日参赛次数
	optional int32 today_purchase_counter = 7; //今日已购买次数
}


//战报信息
message GlobalFirstWarReport
{
	optional GFWarReportType war_report = 1; //消息内容
	repeated string  params = 2; //参数
	optional uint64 time_stamp = 3; //发生时间戳
}





