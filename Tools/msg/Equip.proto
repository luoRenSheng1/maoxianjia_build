	optional uint64 equip_guid = 2; //卖的装备-成功的话，客户端可以删除
	optional int32 player_level = 3; //玩家等级
	optional int64 player_exp = 4;  //玩家经验
	optional Finance account_finance = 5;  //账户所有各种货币其余额
	
}	 

  
