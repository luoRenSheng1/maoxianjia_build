syntax = "proto2";
import "ErrCode.proto";
import "Enum.proto";
import "Common.proto";
package msg;

//下发新获取的传承装备 支持多件
message NewLoreEquips_PC    //eMsg_NewLoreEquips_PC = 750; 
{
	repeated EquipInfo lore_equips = 1;
}		

//出售传承装备请求 
message SellLoreEquip_CS   //eMsg_SellLoreEquip_CS = 751;
{
	optional uint64 equip_guid = 1; //要卖的装备
}		   					
			
//出售传承装备回复
message SellLoreEquip_SC   //eMsg_SellLoreEquip_SC = 752;   
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional uint64 equip_guid = 2; //卖的装备-成功的话，客户端可以删除
	optional Finance account_finance = 5;  //账户所有各种货币其余额
	
}	
         
//穿上传承装备请求
message LoreEquipOnPlayer_CS   //eMsg_LoreEquipOnPlayer_CS = 753;
{
	optional uint64 equip_guid = 1; //装备
}		   					
			
//穿上传承装备回复
message LoreEquipOnPlayer_SC   //eMsg_LoreEquipOnPlayer_SC = 754; 
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional uint64 equip_guid = 2; //装备上的equip guid
	optional uint64 replaced_equip_guid = 3; //替换下的equip guid，为0表示没有替换，原来栏位是空
	optional PlayerEquipSlotsInfo equip_slots = 4;  //装备栏状信息
}	         
	      
//脱下传承装备请求
message TakeOffLoreEquip_CS   //eMsg_TakeOffLoreEquip_CS = 755; 
{
	optional uint64 equip_guid = 1; //脱下装备
}		   					
			
//脱下传承装备回复
message TakeOffLoreEquip_SC  //eMsg_TakeOffLoreEquip_SC = 756;    
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional uint64 equip_guid = 2; //脱下的equip guid
	optional PlayerEquipSlotsInfo equip_slots = 3;  //装备栏状信息
}         
	        
 //换下传承装备请求
message ReplaceLoreEquip_CS    //eMsg_ReplaceLoreEquip_CS = 757;  
{
	optional uint64 equip_guid = 1; //替换的装备
}

 //换下传承装备回复  
message ReplaceLoreEquip_SC  //eMsg_ReplaceLoreEquip_SC = 758;
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	optional uint64 equip_guid = 2; //脱下的equip guid
	optional PlayerEquipSlotsInfo equip_slots = 3;  //装备栏状信息
}        
	     
	      
//删除传承装备                    
message DelLoreEquips_PC   //eMsg_DelLoreEquips_PC = 759;    
{
	optional uint64 equip_guid = 1; //客户端可以删除装备
}          
	      
	       
	   

//一键回收传承装备请求
message BatchSellLoreEquip_CS   //eMsg_BatchSellLoreEquip_CS = 760;  
{
	repeated eLoreEquipQuality equip_quality = 1; //要卖的品质
}		   					
			
 //一键回收出售传承装备回复
message BatchSellLoreEquip_SC   //eMsg_BatchSellLoreEquip_SC = 761;     
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	repeated uint64 equip_guid = 2; //卖的装备-成功的话，客户端可以删除
	optional Finance account_finance = 5;  //账户所有各种货币其余额
	
}










