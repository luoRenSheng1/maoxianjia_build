{
	optional EquipBox   box_info  =1; //最新箱子信息
}	   
		   
//下发所有装备信息   
message Equips_PC   //eMsg_Equips_PC = 705; 
{
	repeated EquipInfo equips = 1;
	optional SplitPkgPC split_pkg = 2;
}		   					
			
//下发新获取的装备 支持多件 
message NewEquips_PC   //eMsg_NewEquips_PC = 706; 
{
	repeated EquipInfo equips = 1;
}		

		   
//宝箱生成装备请求   
message GenEquips_CS   //eMsg_GenEquips_CS = 707;
{
	optional int32 gen_times = 1;  //生成次数，目前填1，未来可支持多抽
	optional uint32 batch_stuff_id = 2; //树id
	optional uint64 event_guid = 3;  //事件guid
}		   					
			
 //宝箱生成装备回复
message GenEquips_SC   //eMsg_GenEquips_SC = 708;   
{
	optional eErrCode	result = 1;// [default = eSucceed];	 //处理结果
	repeated EquipInfo equips = 2;   //生成的装备，暂时只有一件
	optional Finance account_finance = 5;  //账户所有各种货币其余额
	optional ItemInfo cosumed_keys = 6;  //消耗掉的钥匙
	optional uint32 batch_stuff_id = 7; //树id
	optional eRandomEventStatus batch_stuff_event_status = 8; //树状态   
	optional uint64 event_guid = 9;  //事件guid
}	
	             
//出售装备请求  
message SellEquip_CS   //eMsg_SellEquip_CS = 709; 
{
	optional uint64 equip_guid = 1; //要卖的装备
}		   					
			
