syntax = "proto3";

package Config;

message ConfigPetBasisUnit {
  int32 Id = 1;
  string NameNote = 2;
  string Name = 3;
  int32 Type = 4;
  int32 Quality = 5;
  int32 AttackSkillId = 6;
  int32 SkillGroupId = 7;
  string StoryNote = 8;
  string Story = 9;
  string IconPath = 10;
  string FullBodyImage = 11;
  string PetModel = 12;
  int32 Inherit = 13;
  int32 Floor = 14;
  int32 Upper = 15;
  int32 AtkSpeed = 16;
  int32 ModelScale = 17;
  repeated int32 PetQuotesId = 18;
}
