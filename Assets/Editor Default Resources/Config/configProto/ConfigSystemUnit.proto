syntax = "proto3";

package Config;

message ConfigSystemUnit {
  int32 Id = 1;
  string NameNote = 2;
  string Name = 3;
  string NameParam = 4;
  int32 ConditionType = 5;
  string Condition = 6;
  string DescNote = 7;
  string Desc = 8;
  string DescParam = 9;
  int32 Icon = 10;
  int32 Position = 11;
  int32 Show = 12;
}
